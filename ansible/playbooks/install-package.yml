---
- name: Install required Linux packages
  hosts: managed
  become: true
  gather_facts: true

  tasks:
    - name: Update APT package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install curl
      ansible.builtin.apt:
        name: curl
        state: present

    - name: Verify curl installation
      ansible.builtin.command: curl --version
      register: curl_version
      changed_when: false

    - name: Display curl version
      ansible.builtin.debug:
        msg: "{{ curl_version.stdout_lines[0] }}"
